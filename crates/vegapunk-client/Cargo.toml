[package]
name = "vegapunk-client"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
tonic = { version = "0.12", default-features = false, features = ["transport", "codegen", "prost", "tls", "tls-native-roots"] }
prost = "0.13"
tokio.workspace = true
tonic-types = "0.12"
thiserror.workspace = true

[build-dependencies]
tonic-build = { version = "0.12", default-features = false, features = ["prost", "transport"] }
