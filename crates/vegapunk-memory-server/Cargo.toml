[package]
name = "vegapunk-memory-server"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "vegapunk-memory-server"
path = "src/main.rs"

[dependencies]
tokio.workspace = true
axum.workspace = true
axum-extra.workspace = true
sqlx.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
anyhow.workspace = true
async-trait.workspace = true
ulid.workspace = true
url.workspace = true

llm-memory-core = { path = "../llm-memory-core" }
vegapunk-client = { path = "../vegapunk-client" }
vegapunk-memory-storage = { path = "../vegapunk-memory-storage" }
vegapunk-memory-auth = { path = "../vegapunk-memory-auth" }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
tower = { version = "0.5", features = ["util"] }
tonic = { version = "0.12", default-features = false, features = ["transport"] }
